[package]
name = "my_bevy_game"
version = "0.1.0"
edition = "2024"
default-run = "my_bevy_game"

[dependencies]
bevy = { version = "0.20", features = ["bevy_feathers","pbr_anisotropy_texture","file_watcher"] }
bevy-volumetric-clouds = "0.2.0"
bevy_symbios_ground = "0.7.0"
chacha20 = "0.10.2"
rand = "0.10.3"
 
[profile.dev]
opt-level=1

[profile.dev.package."*"]
opt-level=3

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[patch.crates-io]
bevy_symbios_ground = { git = "https://github.com/ruwmy-ok/bevy_symbios_ground.git", branch = "main" }
